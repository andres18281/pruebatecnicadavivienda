server:
  port: ${PORT:8080}
  tomcat:
    basedir: /tmp

spring:
  application:
    name: notification-service
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      service: notification-service

app:
  ws-path: ${WS_PATH:/ws}
  heartbeat-ms: ${WS_HEARTBEAT_SECONDS:25}000

logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd''T''HH:mm:ss.SSS}","level":"%level","service":"notification-service","message":"%m"}%n'
