groups:
  - name: techdocs-slo
    interval: 15s
    rules:
      - record: techdocs:search:p50_seconds
        expr: |
          histogram_quantile(0.50,
            sum by (le) (rate(http_server_requests_seconds_bucket{service="search-service",uri="/api/v1/search"}[5m]))
          )
      - record: techdocs:search:p95_seconds
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{service="search-service",uri="/api/v1/search"}[5m]))
          )
      - record: techdocs:search:p99_seconds
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_server_requests_seconds_bucket{service="search-service",uri="/api/v1/search"}[5m]))
          )
      - record: techdocs:http:request_rate
        expr: sum by (service) (rate(http_server_requests_seconds_count[5m]))
      - record: techdocs:http:error_rate
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
      - record: techdocs:upload:rate
        expr: sum(rate(http_server_requests_seconds_count{service="document-service",uri="/api/v1/documents",method="POST"}[5m]))
      - record: techdocs:pg:cache_hit_ratio
        expr: |
          pg_stat_database_blks_hit{datname="techdocs"}
          /
          clamp_min(pg_stat_database_blks_hit{datname="techdocs"} + pg_stat_database_blks_read{datname="techdocs"}, 1)
      - record: techdocs:jvm:heap_used_bytes
        expr: sum by (service) (jvm_memory_used_bytes{area="heap"})
      - record: techdocs:jvm:cpu_usage
        expr: process_cpu_usage
      - record: techdocs:ram:container_bytes
        expr: sum by (compose_service) (container_memory_working_set_bytes{compose_service!=""})
      - record: techdocs:ram:container_total_bytes
        expr: sum(container_memory_working_set_bytes{compose_service!=""})
      - record: techdocs:minio:used_bytes
        expr: minio_cluster_usage_total_bytes
      - record: techdocs:minio:usable_bytes
        expr: minio_cluster_capacity_usable_total_bytes
      - record: techdocs:minio:free_bytes
        expr: minio_cluster_capacity_usable_free_bytes
      - record: techdocs:minio:disk_used_ratio
        expr: |
          minio_cluster_usage_total_bytes
          /
          clamp_min(minio_cluster_capacity_usable_total_bytes, 1)
      - record: techdocs:minio:volume_used_ratio
        expr: |
          1 - (
            minio_cluster_capacity_usable_free_bytes
            /
            clamp_min(minio_cluster_capacity_usable_total_bytes, 1)
          )
      - record: techdocs:es:disk_used_bytes
        expr: elasticsearch_filesystem_data_size_bytes - elasticsearch_filesystem_data_available_bytes
      - record: techdocs:es:disk_used_ratio
        expr: |
          1 - (
            elasticsearch_filesystem_data_available_bytes
            /
            clamp_min(elasticsearch_filesystem_data_size_bytes, 1)
          )
      - record: techdocs:pg:checkpoints_per_second
        expr: |
          rate(pg_stat_bgwriter_checkpoints_timed_total[5m])
          + rate(pg_stat_bgwriter_checkpoints_req_total[5m])
      - record: techdocs:container:running
        expr: count(docker_container_memory_usage_total_bytes{compose_project="tech-docs-platform"})
      - record: techdocs:container:cpu_ratio
        expr: sum by (compose_service) (docker_container_cpu_utilization_ratio{compose_project="tech-docs-platform"})
      - record: techdocs:container:memory_bytes
        expr: sum by (compose_service) (docker_container_memory_usage_total_bytes{compose_project="tech-docs-platform"})
      - record: techdocs:queue:process_rate
        expr: sum(rate(spring_rabbitmq_listener_seconds_count{queue="documents.process"}[1m]))
      - record: techdocs:queue:process_errors
        expr: sum(rate(spring_rabbitmq_listener_seconds_count{queue="documents.process",result!="success"}[1m]))
      - record: techdocs:queue:process_duration_seconds
        expr: |
          sum(rate(spring_rabbitmq_listener_seconds_sum{queue="documents.process"}[5m]))
          /
          clamp_min(sum(rate(spring_rabbitmq_listener_seconds_count{queue="documents.process"}[5m])), 0.001)
      - record: techdocs:queue:publish_rate
        expr: sum(rate(rabbitmq_global_messages_received_total{queue_type="rabbit_classic_queue"}[1m]))
      - record: techdocs:queue:deliver_rate
        expr: sum(rate(rabbitmq_global_messages_delivered_total{queue_type="rabbit_classic_queue"}[1m]))
      - record: techdocs:queue:ack_rate
        expr: sum(rate(rabbitmq_global_messages_acknowledged_total{queue_type="rabbit_classic_queue"}[1m]))
