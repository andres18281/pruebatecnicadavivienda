groups:
  - name: techdocs-sla
    rules:
      - alert: SearchLatencyP95Alta
        expr: techdocs:search:p95_seconds > 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "p95 de busqueda supera 1 s (SLA incumplido)"

      - alert: SearchLatencyP99Alta
        expr: techdocs:search:p99_seconds > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p99 de busqueda supera 1 s"

      - alert: ColaProcesamientoAcumulada
        expr: rabbitmq_detailed_queue_messages_ready{queue="documents.process"} > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "La cola documents.process supera 500 mensajes listos"

      - alert: DeadLetterQueueConMensajes
        expr: rabbitmq_detailed_queue_messages{queue="documents.process.dlq"} > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Hay documentos que fallaron definitivamente (estado ERROR)"

      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "El job {{ $labels.job }} no responde al scrape"

  - name: techdocs-infra
    rules:
      - alert: PostgresCaido
        expr: up{job="postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "postgres-exporter no alcanza PostgreSQL"

      - alert: PostgresCacheHitBajo
        expr: techdocs:pg:cache_hit_ratio < 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "El cache hit ratio de techdocs bajo de 90%"

      - alert: PostgresConexionesAltas
        expr: pg_stat_database_numbackends{datname="techdocs"} > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Demasiadas conexiones en la base techdocs"

      - alert: ElasticsearchClusterRojo
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "El cluster de Elasticsearch esta en rojo"

      - alert: ElasticsearchClusterAmarillo
        expr: elasticsearch_cluster_health_status{color="yellow"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "El cluster de Elasticsearch esta en amarillo"

      - alert: OutboxAtrasado
        expr: pg_techdocs_outbox_pending > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El outbox tiene mas de 50 eventos sin publicar"

      - alert: DocumentosEnError
        expr: pg_techdocs_documents_count{estado="ERROR"} > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Hay documentos en estado ERROR"

      - alert: MinioDiscoAlto
        expr: techdocs:minio:disk_used_ratio > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "MinIO usa mas del 85% del disco usable"

      - alert: ElasticsearchDiscoAlto
        expr: techdocs:es:disk_used_ratio > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Elasticsearch usa mas del 85% del disco de datos"

      - alert: ContenedorRamAlta
        expr: |
          (
            container_memory_working_set_bytes{compose_service!=""}
            / container_spec_memory_limit_bytes{compose_service!=""}
          ) > 0.9
          and container_spec_memory_limit_bytes{compose_service!=""} < 1e15
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "El contenedor {{ $labels.compose_service }} supera el 90% de su limite de RAM"
