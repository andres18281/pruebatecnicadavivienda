name: tech-docs-platform

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-service: &app-service
  <<: *hardened
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: otlp
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 120s

services:

  gateway:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.27-alpine
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    volumes:
      - ./infra/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, app-net]
    depends_on:
      frontend:             { condition: service_healthy }
      document-service:     { condition: service_healthy }
      search-service:       { condition: service_healthy }
      notification-service: { condition: service_healthy }
      telemetry-service:    { condition: service_healthy }

  frontend:
    <<: *hardened
    build: ./frontend
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app-net]

  document-service:
    <<: *app-service
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: document-service
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: documents
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_INDEX: documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      ALLOWED_MIME_TYPES: text/plain,text/markdown,application/pdf
    healthcheck: *app-healthcheck
    networks: [app-net, data-net, obs-net]
    depends_on:
      postgres:      { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio-init:    { condition: service_completed_successfully }

  search-service:
    <<: *app-service
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: search-service
      PORT: "8080"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_INDEX: documents
      SEARCH_TIMEOUT_MS: "900"
      SEARCH_MAX_PAGE_SIZE: "50"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    healthcheck: *app-healthcheck
    networks: [app-net, data-net, obs-net]
    depends_on:
      elasticsearch: { condition: service_healthy }
      es-init:       { condition: service_completed_successfully }
      rabbitmq:      { condition: service_healthy }

  processing-worker:
    <<: *app-service
    build:
      context: .
      dockerfile: services/processing-worker/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: processing-worker
      METRICS_PORT: "9100"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      RABBITMQ_PREFETCH: "2"
      MAX_RETRIES: "3"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: documents
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_INDEX: documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    networks: [data-net, obs-net]
    deploy:
      replicas: 2
    depends_on:
      postgres:      { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio-init:    { condition: service_completed_successfully }
      es-init:       { condition: service_completed_successfully }

  notification-service:
    <<: *app-service
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification-service
      PORT: "8080"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      WS_PATH: /ws
      WS_HEARTBEAT_SECONDS: "25"
    healthcheck: *app-healthcheck
    networks: [app-net, data-net, obs-net]
    depends_on:
      rabbitmq: { condition: service_healthy }

  telemetry-service:
    <<: *app-service
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: telemetry-service
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    healthcheck: *app-healthcheck
    networks: [app-net, data-net, obs-net]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  postgres:
    <<: *hardened
    image: postgres:16-alpine
    user: "0:0"
    cap_drop: []
    security_opt:
      - no-new-privileges:false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data-net]

  elasticsearch:
    <<: *hardened
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    user: "1000:0"
    environment:
      node.name: es01
      cluster.name: techdocs-cluster
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    mem_limit: 2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [data-net, obs-net]

  rabbitmq:
    <<: *hardened
    image: rabbitmq:3.13-management
    user: "999:999"
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [data-net, obs-net]

  minio:
    <<: *hardened
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    user: "0:0"
    cap_drop: []
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data-net, obs-net]

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    user: "0:0"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/documents &&
        mc anonymous set none local/documents
    networks: [data-net]
    depends_on:
      minio: { condition: service_healthy }

  es-init:
    image: curlimages/curl:8.10.1
    user: "100:101"
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    entrypoint: ["/bin/sh", "/init/init-index.sh"]
    volumes:
      - ./infra/elasticsearch:/init:ro
    networks: [data-net]
    depends_on:
      elasticsearch: { condition: service_healthy }

  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector-contrib:0.111.0
    user: "10001:10001"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [obs-net]
    depends_on: [loki, jaeger]

  prometheus:
    <<: *hardened
    image: prom/prometheus:v2.55.0
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [obs-net]

  loki:
    <<: *hardened
    image: grafana/loki:3.2.0
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    networks: [obs-net]

  jaeger:
    <<: *hardened
    image: jaegertracing/all-in-one:1.62.0
    user: "10001:10001"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    networks: [obs-net]

  grafana:
    <<: *hardened
    image: grafana/grafana:11.3.0
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge, obs-net]
    depends_on: [prometheus, loki, jaeger]

  postgres-exporter:
    <<: *hardened
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    user: "65534:65534"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [data-net, obs-net]
    depends_on:
      postgres: { condition: service_healthy }

  elasticsearch-exporter:
    <<: *hardened
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    user: "65534:65534"
    command:
      - --es.uri=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      - --es.all
    networks: [data-net, obs-net]
    depends_on:
      elasticsearch: { condition: service_healthy }

networks:
  edge:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true
  obs-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  esdata:
  rabbitdata:
  promdata:
  lokidata:
  grafanadata:
